<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sequence Diagram: Thin Extension — Smart MCP Server Flow</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      padding: 24px 30px;
      width: 1440px;
      margin: 0 auto;
    }

    .seq-header {
      font-family: 'JetBrains Mono', monospace;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .seq-header h1 {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
    }
    .seq-header .badge {
      font-size: 11px;
      background: #1e293b;
      color: #94a3b8;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    /* SVG Sequence Styling */
    svg {
      width: 1380px;
      height: 720px;
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 8px;
    }

    .lifeline-header {
      fill: #1e293b;
      stroke: #38bdf8;
      stroke-width: 1.5;
      rx: 6;
    }
    .lifeline-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #f8fafc;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .lifeline-subtext {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #94a3b8;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .lifeline-line {
      stroke: #334155;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }
    .activation-bar {
      fill: #0284c7;
      stroke: #38bdf8;
      stroke-width: 1;
      opacity: 0.85;
      rx: 2;
    }
    .msg-line {
      stroke: #38bdf8;
      stroke-width: 1.5;
      marker-end: url(#arrow-blue);
    }
    .msg-resp {
      stroke: #94a3b8;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
      marker-end: url(#arrow-gray);
    }
    .msg-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .msg-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #38bdf8;
      font-weight: 700;
    }
    .loop-box {
      fill: rgba(56, 189, 248, 0.03);
      stroke: #0284c7;
      stroke-width: 1.5;
      stroke-dasharray: 6 3;
      rx: 6;
    }
    .loop-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      fill: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="seq-header">
    <h1>UML SEQUENCE FLOW: THIN EXTENSION — SMART MCP SERVER</h1>
    <span class="badge">EXECUTION SEQUENCE BLUEPRINT</span>
  </div>

  <svg>
    <defs>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
      </marker>
      <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
      </marker>
      <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
      </marker>
      <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
      </marker>
    </defs>

    <!-- LIFELINE 1: AI CLIENT (X = 140) -->
    <rect class="lifeline-header" x="50" y="20" width="180" height="46" stroke="#c084fc" />
    <text class="lifeline-text" x="140" y="38">AI Client / AGY</text>
    <text class="lifeline-subtext" x="140" y="54">Claude / Antigravity</text>
    <line class="lifeline-line" x1="140" y1="66" x2="140" y2="700" />

    <!-- LIFELINE 2: BUN MCP DAEMON (X = 420) -->
    <rect class="lifeline-header" x="320" y="20" width="200" height="46" stroke="#38bdf8" />
    <text class="lifeline-text" x="420" y="38">Bun MCP Daemon</text>
    <text class="lifeline-subtext" x="420" y="54">Flow Orchestrator & Backend</text>
    <line class="lifeline-line" x1="420" y1="66" x2="420" y2="700" />

    <!-- LIFELINE 3: SERVER ENGINES (X = 700) -->
    <rect class="lifeline-header" x="610" y="20" width="180" height="46" stroke="#38bdf8" />
    <text class="lifeline-text" x="700" y="38">Server Engines</text>
    <text class="lifeline-subtext" x="700" y="54">Geometry / Crawl / AXTree</text>
    <line class="lifeline-line" x1="700" y1="66" x2="700" y2="700" />

    <!-- LIFELINE 4: BACKGROUND SW (X = 960) -->
    <rect class="lifeline-header" x="870" y="20" width="180" height="46" stroke="#f59e0b" />
    <text class="lifeline-text" x="960" y="38">Background SW</text>
    <text class="lifeline-subtext" x="960" y="54">Extension Thin Driver</text>
    <line class="lifeline-line" x1="960" y1="66" x2="960" y2="700" />

    <!-- LIFELINE 5: CHROMIUM CDP (X = 1220) -->
    <rect class="lifeline-header" x="1130" y="20" width="180" height="46" stroke="#34d399" />
    <text class="lifeline-text" x="1220" y="38">Chromium Core</text>
    <text class="lifeline-subtext" x="1220" y="54">chrome.debugger C++ IPC</text>
    <line class="lifeline-line" x1="1220" y1="66" x2="1220" y2="700" />

    <!-- ACTIVATION BARS -->
    <rect class="activation-bar" x="135" y="90" width="10" height="580" fill="#a855f7" stroke="#c084fc" />
    <rect class="activation-bar" x="415" y="95" width="10" height="570" fill="#0284c7" stroke="#38bdf8" />
    <rect class="activation-bar" x="695" y="140" width="10" height="40" fill="#0284c7" stroke="#38bdf8" />
    <rect class="activation-bar" x="955" y="210" width="10" height="230" fill="#d97706" stroke="#fbbf24" />
    <rect class="activation-bar" x="1215" y="230" width="10" height="190" fill="#059669" stroke="#34d399" />

    <!-- MESSAGE 1: Stdio Tool Call -->
    <line class="msg-line" x1="145" y1="100" x2="415" y2="100" stroke="#c084fc" marker-end="url(#arrow-blue)" />
    <text class="msg-text" x="160" y="94">1. tools/call: browser_act({ action: "run_flow", steps: [...] })</text>
    <text class="msg-tag" x="160" y="112">[Stdio Pipe JSON-RPC 2.0]</text>

    <!-- MESSAGE 2: Init SQLite Session -->
    <line class="msg-line" x1="425" y1="125" x2="520" y2="125" stroke="#38bdf8" />
    <line class="msg-line" x1="520" y1="125" x2="520" y2="140" stroke="#38bdf8" />
    <line class="msg-line" x1="520" y1="140" x2="425" y2="140" stroke="#38bdf8" marker-end="url(#arrow-blue)" />
    <text class="msg-text" x="530" y="135">dataStore.createSession(id) [SQLite I/O]</text>

    <!-- MESSAGE 3: Calculate Geometry Trajectory -->
    <line class="msg-line" x1="425" y1="155" x2="695" y2="155" stroke="#38bdf8" marker-end="url(#arrow-blue)" />
    <text class="msg-text" x="440" y="150">2. geometry.generateHumanCursorPath(start, end, "easeInOut")</text>
    <line class="msg-resp" x1="695" y1="175" x2="425" y2="175" />
    <text class="msg-text" x="480" y="170">returns: Point[] { x, y }</text>

    <!-- LOOP BOX: Multi-step Flow Execution Loop -->
    <rect class="loop-box" x="380" y="195" width="870" height="340" />
    <text class="loop-label" x="395" y="212">LOOP: for (step of steps) with 3500ms AutoWait Retry</text>

    <!-- MESSAGE 4: WebSocket Primitive Dispatch -->
    <line class="msg-line" x1="425" y1="230" x2="955" y2="230" stroke="#10b981" marker-end="url(#arrow-green)" />
    <text class="msg-text" x="445" y="224" fill="#34d399">3. WS Send: { action: "dispatch_primitive", type: "click", x, y }</text>
    <text class="msg-tag" x="445" y="242" fill="#34d399">[Direct WebSocket 127.0.0.1:8765 | 2.1ms Latency]</text>

    <!-- MESSAGE 5: CDP Input Event -->
    <line class="msg-line" x1="965" y1="260" x2="1215" y2="260" stroke="#f59e0b" marker-end="url(#arrow-amber)" />
    <text class="msg-text" x="980" y="254" fill="#fbbf24">4. sendCommand("Input.dispatchMouseEvent", { type: "mousePressed", x, y })</text>
    <text class="msg-tag" x="980" y="272" fill="#fbbf24">[Chromium Native C++ IPC]</text>

    <!-- MESSAGE 6: DOM Mutation settlement -->
    <line class="msg-line" x1="965" y1="295" x2="1215" y2="295" stroke="#f59e0b" marker-end="url(#arrow-amber)" />
    <text class="msg-text" x="980" y="290" fill="#fbbf24">5. sendCommand("Accessibility.getFullAXTree")</text>

    <line class="msg-resp" x1="1215" y1="320" x2="965" y2="320" />
    <text class="msg-text" x="1030" y="315">Raw AXTree Buffer</text>

    <!-- MESSAGE 7: Stream Raw AXTree to Server -->
    <line class="msg-resp" x1="955" y1="345" x2="425" y2="345" stroke="#10b981" marker-end="url(#arrow-green)" />
    <text class="msg-text" x="520" y="340" fill="#34d399">6. Binary Frame: Raw AXTree Stream</text>

    <!-- MESSAGE 8: Server Snapshot Pruning & Token Optimization -->
    <line class="msg-line" x1="425" y1="375" x2="695" y2="375" stroke="#38bdf8" marker-end="url(#arrow-blue)" />
    <text class="msg-text" x="440" y="370">7. snapshot.pruneAndCompact(axTree) $\rightarrow$ Compact {i, r, n, v}</text>
    <line class="msg-resp" x1="695" y1="395" x2="425" y2="395" />
    <text class="msg-text" x="460" y="390">returns: Token-Minimized AXTree (-65% size)</text>

    <!-- MESSAGE 9: Step delta commit to SQLite -->
    <line class="msg-line" x1="425" y1="425" x2="520" y2="425" stroke="#38bdf8" />
    <line class="msg-line" x1="520" y1="425" x2="520" y2="440" stroke="#38bdf8" />
    <line class="msg-line" x1="520" y1="440" x2="425" y2="440" stroke="#38bdf8" marker-end="url(#arrow-blue)" />
    <text class="msg-text" x="530" y="435">dataStore.recordFlowStep(stepId, delta, durationMs)</text>

    <!-- MESSAGE 10: In-Page Event Relay (Recorder) -->
    <line class="msg-line" x1="1215" y1="475" x2="965" y2="475" stroke="#f59e0b" marker-end="url(#arrow-amber)" />
    <text class="msg-text" x="1000" y="470" fill="#fbbf24">8. In-Page Trap: DOM click event captured</text>

    <line class="msg-line" x1="955" y1="500" x2="425" y2="500" stroke="#10b981" marker-end="url(#arrow-green)" />
    <text class="msg-text" x="540" y="495" fill="#34d399">9. WS Event: { event: "user_interaction_recorded" }</text>

    <!-- FINAL RESPONSE -->
    <line class="msg-resp" x1="415" y1="580" x2="145" y2="580" stroke="#c084fc" marker-end="url(#arrow-blue)" />
    <text class="msg-text" x="160" y="574" fill="#c084fc">10. ToolCallResponse: { success: true, stepsExecuted: N, durationMs: 420 }</text>

    <!-- FOOTER SUMMARY BAR -->
    <rect x="50" y="620" width="1280" height="60" fill="#1e293b" stroke="#334155" rx="6" />
    <text class="msg-text" x="70" y="645" fill="#38bdf8" font-size="12px">⚡ KEY ARCHITECTURAL METRICS:</text>
    <text class="msg-text" x="70" y="665" fill="#94a3b8" font-size="11px">• Extension Worker: Thin CDP Driver Only (0MB Heavy Compute) | • Daemon: Master Orchestrator + SQLite Logging | • Latency: 2.1ms Direct WS</text>
  </svg>

</body>
</html>
