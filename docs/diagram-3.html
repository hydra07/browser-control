<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sequence Diagram: Real-Time Screen Recording Stream Engine</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      padding: 24px 30px;
      width: 1440px;
      margin: 0 auto;
    }

    .seq-header {
      font-family: 'JetBrains Mono', monospace;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .seq-header h1 {
      font-size: 18px;
      font-weight: 800;
      color: #f43f5e;
    }
    .seq-header .badge {
      font-size: 11px;
      background: #1e293b;
      color: #94a3b8;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    svg {
      width: 1380px;
      height: 720px;
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 8px;
    }

    .lifeline-header {
      fill: #1e293b;
      stroke: #f43f5e;
      stroke-width: 1.5;
      rx: 5;
    }
    .lifeline-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      fill: #f8fafc;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .lifeline-subtext {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #94a3b8;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .lifeline-line {
      stroke: #334155;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }
    .msg-line {
      stroke-width: 1.5;
    }
    .msg-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
    }
    .loop-box {
      fill: rgba(244, 63, 94, 0.03);
      stroke: #f43f5e;
      stroke-width: 1.5;
      stroke-dasharray: 6 3;
      rx: 6;
    }
    .loop-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      fill: #fb7185;
    }
  </style>
</head>
<body>

  <div class="seq-header">
    <h1>UML SEQUENCE FLOW: REAL-TIME VIDEO STREAMING PIPELINE</h1>
    <span class="badge">O(1) MEMORY BUFFER & DISK SINK SPECIFICATION</span>
  </div>

  <svg>
    <defs>
      <marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e" />
      </marker>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
      </marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
      </marker>
      <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
      </marker>
    </defs>

    <!-- LIFELINE 1: CHROMIUM CDP (X = 120) -->
    <rect class="lifeline-header" x="40" y="20" width="160" height="44" stroke="#f43f5e" />
    <text class="lifeline-text" x="120" y="36">Chromium Core</text>
    <text class="lifeline-subtext" x="120" y="50">Page.screencastFrame</text>
    <line class="lifeline-line" x1="120" y1="64" x2="120" y2="700" />

    <!-- LIFELINE 2: CANVAS / ENCODER (X = 380) -->
    <rect class="lifeline-header" x="300" y="20" width="160" height="44" stroke="#f43f5e" />
    <text class="lifeline-text" x="380" y="36">Offscreen Canvas</text>
    <text class="lifeline-subtext" x="380" y="50">Frame Queue & Render</text>
    <line class="lifeline-line" x1="380" y1="64" x2="380" y2="700" />

    <!-- LIFELINE 3: MEDIARECORDER (X = 640) -->
    <rect class="lifeline-header" x="560" y="20" width="160" height="44" stroke="#f43f5e" />
    <text class="lifeline-text" x="640" y="36">MediaRecorder</text>
    <text class="lifeline-subtext" x="640" y="50">timeslice=500ms</text>
    <line class="lifeline-line" x1="640" y1="64" x2="640" y2="700" />

    <!-- LIFELINE 4: WEBSOCKET STREAM (X = 900) -->
    <rect class="lifeline-header" x="820" y="20" width="160" height="44" stroke="#38bdf8" />
    <text class="lifeline-text" x="900" y="36">WS Binary Channel</text>
    <text class="lifeline-subtext" x="900" y="50">Opcode 0x02 Transport</text>
    <line class="lifeline-line" x1="900" y1="64" x2="900" y2="700" />

    <!-- LIFELINE 5: BUN SERVER SINK (X = 1140) -->
    <rect class="lifeline-header" x="1060" y="20" width="160" height="44" stroke="#10b981" />
    <text class="lifeline-text" x="1140" y="36">Bun FileSink</text>
    <text class="lifeline-subtext" x="1140" y="50">data/videos/*.webm</text>
    <line class="lifeline-line" x1="1140" y1="64" x2="1140" y2="700" />

    <!-- LIFELINE 6: DISK (X = 1320) -->
    <rect class="lifeline-header" x="1260" y="20" width="120" height="44" stroke="#10b981" />
    <text class="lifeline-text" x="1320" y="36">OS Disk</text>
    <text class="lifeline-subtext" x="1320" y="50">Direct I/O</text>
    <line class="lifeline-line" x1="1320" y1="64" x2="1320" y2="700" />

    <!-- CALL 1: Start Screencast -->
    <line class="msg-line" x1="380" y1="90" x2="120" y2="90" stroke="#f43f5e" marker-end="url(#arr-pink)" />
    <text class="msg-text" x="140" y="85" fill="#fb7185">1. Page.startScreencast({ format: "jpeg", quality: 60, everyNthFrame: 1 })</text>

    <!-- CALL 2: Init FileStream on Server -->
    <line class="msg-line" x1="900" y1="120" x2="1140" y2="120" stroke="#10b981" marker-end="url(#arr-green)" />
    <text class="msg-text" x="920" y="115" fill="#34d399">2. fileStream = fs.createWriteStream(path, { flags: "a" })</text>

    <!-- CONTINUOUS FRAME LOOP -->
    <rect class="loop-box" x="70" y="145" width="1250" height="340" />
    <text class="loop-label" x="85" y="165">PARALLEL CONTINUOUS STREAM: 30 FPS Frame Rendering & 500ms Binary Chunk Flush</text>

    <!-- 30 FPS Frame Stream -->
    <line class="msg-line" x1="120" y1="190" x2="380" y2="190" stroke="#f43f5e" marker-end="url(#arr-pink)" />
    <text class="msg-text" x="140" y="185" fill="#fb7185">3. Event: Page.screencastFrame { data, sessionId } [Every 33ms]</text>

    <line class="msg-line" x1="380" y1="215" x2="120" y2="215" stroke="#94a3b8" stroke-dasharray="4 4" marker-end="url(#arr-gray)" />
    <text class="msg-text" x="150" y="210" fill="#94a3b8">4. Page.screencastFrameAck { sessionId }</text>

    <line class="msg-line" x1="380" y1="245" x2="640" y2="245" stroke="#f43f5e" marker-end="url(#arr-pink)" />
    <text class="msg-text" x="400" y="240" fill="#fb7185">5. CanvasStream.getVideoTracks() $\rightarrow$ MediaRecorder Track Input</text>

    <!-- 500ms Chunk Event -->
    <line class="msg-line" x1="640" y1="285" x2="640" y2="305" stroke="#f43f5e" />
    <line class="msg-line" x1="640" y1="305" x2="900" y2="305" stroke="#38bdf8" marker-end="url(#arr-blue)" />
    <text class="msg-text" x="655" y="295" fill="#38bdf8">6. ondataavailable(event.data: Blob) [Every 500ms Chunk ~35KB]</text>
    <text class="msg-text" x="655" y="322" fill="#4ade80">• Converts: Blob $\rightarrow$ ArrayBuffer $\rightarrow$ WS.send(buffer) $\rightarrow$ Immediate GC (0 RAM Accumulation)</text>

    <!-- WebSocket Flush to Disk -->
    <line class="msg-line" x1="900" y1="355" x2="1140" y2="355" stroke="#10b981" marker-end="url(#arr-green)" />
    <text class="msg-text" x="920" y="348" fill="#34d399">7. WebSocket onmessage(binaryChunk) $\rightarrow$ fileStream.write(chunk)</text>

    <line class="msg-line" x1="1140" y1="385" x2="1320" y2="385" stroke="#10b981" marker-end="url(#arr-green)" />
    <text class="msg-text" x="1160" y="380" fill="#34d399">8. Direct OS Disk Flush [O(1) Memory Invariant]</text>

    <!-- NOTE IN LOOP -->
    <rect x="100" y="420" width="1180" height="45" fill="#1e293b" stroke="#334155" rx="4" />
    <text class="msg-text" x="120" y="440" fill="#34d399">🛡️ CRASH RESILIENCE: Dù tab/trình duyệt bị tắt đột ngột, toàn bộ video đến giây cuối cùng đã được sync xuống đĩa an toàn (Data Loss: 0%)</text>

    <!-- STOP RECORDING TRIGGER -->
    <line class="msg-line" x1="380" y1="520" x2="120" y2="520" stroke="#f43f5e" marker-end="url(#arr-pink)" />
    <text class="msg-text" x="140" y="515" fill="#fb7185">9. Page.stopScreencast()</text>

    <line class="msg-line" x1="640" y1="550" x2="900" y2="550" stroke="#38bdf8" marker-end="url(#arr-blue)" />
    <text class="msg-text" x="660" y="545" fill="#38bdf8">10. MediaRecorder.stop() $\rightarrow$ Send Final Chunk</text>

    <line class="msg-line" x1="900" y1="580" x2="1140" y2="580" stroke="#10b981" marker-end="url(#arr-green)" />
    <text class="msg-text" x="920" y="575" fill="#34d399">11. fileStream.end() [Đóng stream ngay lập tức]</text>

    <line class="msg-line" x1="1140" y1="610" x2="1320" y2="610" stroke="#10b981" marker-end="url(#arr-green)" />
    <text class="msg-text" x="1160" y="605" fill="#34d399">12. File Handle Closed [Latency: 0ms | Video File Ready on Disk]</text>

    <!-- FOOTER SUMMARY -->
    <rect x="40" y="650" width="1300" height="50" fill="#1e293b" stroke="#334155" rx="6" />
    <text class="msg-text" x="60" y="672" fill="#f43f5e" font-size="12px">⚡ STREAMING ENGINE ADVANTAGES:</text>
    <text class="msg-text" x="60" y="690" fill="#94a3b8" font-size="11px">• RAM: Duy trì &lt; 3.0 MB dù quay video dài | • Stop Delay: 0.0 ms (Không chờ encode lại) | • Crash Resilience: Chống mất video 100%</text>
  </svg>

</body>
</html>
