name: CLI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Check versioned fixture privacy
        run: go run ./cmd/check-fixtures -root ..
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o browsercontrol .

  chrome-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: go test -race -count=1 -v ./...
        env:
          BROWSERCONTROL_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          BROWSERCONTROL_E2E_REQUIRED: "1"
          BROWSERCONTROL_E2E_NO_SANDBOX: "1"

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun x biome check app/extension packages
      - run: bun run build
