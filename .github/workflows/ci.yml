name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Type-checks every workspace (app/extension, app/server,
      # packages/shared) via Turborepo — see turbo.json and each
      # workspace's own "check" script.
      - run: bun run check

      # Builds every workspace with a build step — currently just
      # app/extension (WXT: bundles background/offscreen/sidepanel,
      # generates manifest.json from wxt.config.ts + package.json).
      - run: bun run build
