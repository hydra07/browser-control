name: Release

# Triggered by pushing a `vX.Y.Z` tag — see app/extension/scripts/bump-version.ts
# for the local "bump, then git tag" workflow this expects. Attaches the Go CLI
# for each OS/arch plus WXT's extension zip to a GitHub Release; does NOT
# publish to the Chrome Web Store (that needs API credentials this repo
# doesn't have configured).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - run: bun install --frozen-lockfile

      - name: Verify tag matches app/extension's version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('./app/extension/package.json').text()).version)")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match app/extension's version ($PKG_VERSION). Run 'bun run version:bump' (in app/extension) and commit before tagging."
            exit 1
          fi
          echo "Tag matches app/extension's version: $PKG_VERSION"

      - run: bun run check
      - run: bun run --cwd app/extension zip

      - name: Test CLI
        working-directory: cli
        run: go vet ./... && go test -count=1 ./...

      - name: Build CLI binaries
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="browsercontrol_${GITHUB_REF_NAME}_${os}_${arch}"
            bin=browsercontrol; [ "$os" = windows ] && bin=browsercontrol.exe
            rm -rf "build/$name" && mkdir -p "build/$name"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "build/$name/$bin" .
            cp ../README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../../dist/$name.zip" "$name")
            else
              tar -C build -czf "../dist/$name.tar.gz" "$name"
            fi
          done
          cp ../app/extension/.output/*.zip ../dist/
          (cd ../dist && sha256sum * > checksums.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
