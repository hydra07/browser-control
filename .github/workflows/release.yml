name: Release

# Triggered by pushing a `vX.Y.Z` tag — see app/extension/scripts/bump-version.ts
# for the local "bump, then git tag" workflow this expects. Builds the
# extension and attaches WXT's own zip artifact to a GitHub Release; does
# NOT publish to the Chrome Web Store (that needs API credentials this repo
# doesn't have configured — see README's Releasing section for the manual
# steps).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Verify tag matches app/extension's version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('./app/extension/package.json').text()).version)")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match app/extension's version ($PKG_VERSION). Run 'bun run version:bump' (in app/extension) and commit before tagging."
            exit 1
          fi
          echo "Tag matches app/extension's version: $PKG_VERSION"

      - run: bun run check
      - run: bun run --cwd app/extension zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/extension/.output/*.zip
          generate_release_notes: true
