[tools]
bun = "1.3.14"
go = "1.26"
node = "latest"

[tasks.check]
description = "Type-check the extension + shared workspaces (Turborepo) and vet the Go CLI"
run = ["bun run check", "cd cli && go vet ./..."]

[tasks.build]
description = "Build the extension (WXT) and the Go CLI"
run = ["bun run build", "cd cli && go build -o browsercontrol.exe ."]

[tasks.test]
description = "Run extension/shared bun tests and Go CLI tests"
run = ["bun run test", "cd cli && go test ./..."]

[tasks."version:bump"]
description = "Bump the extension's version (app/extension/package.json — WXT reads it straight from there) — prints the git commit/tag/push commands to run next. Usage: mise run version:bump -- patch|minor|major|X.Y.Z"
run = "bun run --cwd app/extension version:bump"
