[tools]
bun = "latest"
node = "latest"

[tasks.replay]
description = "Replay a recorded logs/session-*.jsonl against the live daemon. Usage: mise run replay -- logs/session-xxx.jsonl [--continue] [--delay 500]"
run = "bun run src/server/replay.ts"

[tasks."replay:list"]
description = "List recorded session logs available to replay"
run = "bun run src/server/replay.ts --list"

[tasks."check:daemon"]
description = "Type-check the server (daemon.ts, replay.ts, shared/) — these run directly via Bun and are never tsc-built, so this is their only real type-check."
run = "bun run check:server"
